# Netlify does not build the site. The "Deploy Website" workflow (.github/workflows/site.yml) builds it in GitHub Actions
# and uploads the finished files; previews come from the "Deploy Preview" workflow. This file keeps the publish directory,
# and the ignore command skips every Git-triggered Netlify build (pushes to main, pull requests). Redirects are not here:
# the deploy jobs upload only the built files, so Netlify never reads this file. They live in website/static/_redirects.
[build]
  publish = "website/build"
  ignore = "exit 0"
