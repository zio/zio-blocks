# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  SBT_OPTS: -XX:+PrintCommandLineFlags -Djava.locale.providers=CLDR,JRE
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - main
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ci-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  buildDocs:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.0
      with:
        distribution: corretto
        java-version: '25'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.12.0
    - name: Install yarn
      run: npm install -g yarn
    - name: Install website dependencies
      if: ${{ hashFiles('website/yarn.lock') != '' }}
      run: yarn install --cwd website
    - name: Generate documentation with mdoc
      if: ${{ hashFiles('website/yarn.lock') != '' }}
      run: sbt docs/mdoc
    - name: Check website build process
      if: ${{ hashFiles('website/yarn.lock') != '' }}
      run: yarn --cwd website build
    - name: Upload website build artifact
      uses: actions/upload-artifact@v7
      if: ${{ (hashFiles('website/yarn.lock') != '') && (github.event_name == 'pull_request') }}
      with:
        name: website-artifact
        path: ./website/build
        overwrite: true
        retention-days: 30
    - name: Upload PR Metadata
      if: ${{ github.event_name == 'pull_request' }}
      run: echo "${{ github.event.pull_request.number }}" > pr-number.txt
    - name: Upload PR Metadata
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'pull_request' }}
      with:
        name: pr-metadata
        path: pr-number.txt
        overwrite: true
    - name: Print All Generated Files
      run: find ./website/build -print
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
    - name: Install locale data
      run: |
        sudo apt-get update
        sudo apt-get install -y locales
        sudo locale-gen en_US.UTF-8
    - name: Checkout current branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:17
        apps: sbt
    - name: Cache scala dependencies
      uses: coursier/cache-action@v8
    - name: Check if the workflows are up to date
      run: sbt ciCheckGithubWorkflow
    - name: Lint code
      run: sbt "++2.13; check; headerCheckAll; ++3.8; check; headerCheckAll"
  testJVM:
    name: testJVM
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '17'
        - '25'
        platform:
        - JVM
        scala:
        - 2.13.x
        - 3.3.x
        - 3.8.x
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
        - 32886:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set JVM options for JDK 25+
      if: ${{ matrix.java >= 25 }}
      run: echo "JAVA_TOOL_OPTIONS=-XX:+UseCompactObjectHeaders" >> $GITHUB_ENV
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:${{ matrix.java }}
        jvm-index: https://raw.githubusercontent.com/coursier/jvm-index/refs/heads/master/index.json
        apps: sbt
    - name: Cache scala dependencies
      uses: coursier/cache-action@v8
    - name: Run Scala 2 tests and compile Scala 2 docs
      if: ${{ startsWith(matrix.scala, '2.') }}
      run: sbt ++${{ matrix.scala }} test${{ matrix.platform }} doc${{ matrix.platform }}
    - name: Run Scala 3 tests and docs (JDK 17)
      if: ${{ (startsWith(matrix.scala, '3.')) && (matrix.java == 17) }}
      run: sbt ++${{ matrix.scala }} test${{ matrix.platform }} doc${{ matrix.platform }}
    - name: Run Scala 3 tests with test coverage (JDK 25, skip docs due to scaladoc bug)
      if: ${{ (startsWith(matrix.scala, '3.')) && (matrix.java >= 25) }}
      run: sbt ++${{ matrix.scala }} coverage test${{ matrix.platform }} coverageReport
    - name: Run Scala Next tests
      if: ${{ matrix.scala == '3.8.x' }}
      run: sbt ++3.8.3 scalaNextTests${{ matrix.platform }}/test benchmarks/test
    - name: Compile example project
      if: ${{ matrix.scala == '3.8.x' }}
      run: sbt ++${{ matrix.scala }} schema-examples/compile
  testJS:
    name: testJS
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '17'
        platform:
        - JS
        scala:
        - 2.13.x
        - 3.3.x
        - 3.8.x
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:${{ matrix.java }}
        jvm-index: https://raw.githubusercontent.com/coursier/jvm-index/refs/heads/master/index.json
        apps: sbt
    - name: Cache scala dependencies
      uses: coursier/cache-action@v8
    - name: Run Scala JS tests and compile docs
      run: sbt ++${{ matrix.scala }} testJS docJS
  testGolem:
    name: Test Golem (Scala 3.8.x / 2.13.x)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '17'
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:${{ matrix.java }}
        jvm-index: https://raw.githubusercontent.com/coursier/jvm-index/refs/heads/master/index.json
        apps: sbt
    - name: Cache scala dependencies
      uses: coursier/cache-action@v8
    - name: Run Golem tests (Scala 3.8)
      run: sbt "++3.8.2; zioGolemModelJVM/test; zioGolemModelJS/test; zioGolemCoreJS/test; zioGolemMacros/test; zioGolemTestAgents/fastLinkJS"
    - name: Run Golem tests (Scala 2.13)
      run: sbt "++2.13.18; zioGolemModelJVM/test; zioGolemModelJS/test; zioGolemCoreJS/test; zioGolemMacros/test; zioGolemTestAgents/fastLinkJS"
    - name: Test Golem build codegen (Scala 3.3)
      run: sbt "++3.3.7; zioGolemBuildCodegen/test"
    - name: Compile Golem sbt plugin (Scala 2.12)
      run: sbt "++2.12.21!; zioGolemSbt/compile"
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - lint
    - testJVM
    - testJS
    - testGolem
    - buildDocs
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    continue-on-error: false
    needs:
    - ci
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push') }}
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:25
        apps: sbt
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Release
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 30
        max_attempts: 3
        command: sbt ci-release
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
  release-docs:
    name: Release Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: release-docs-${{ github.ref }}
      cancel-in-progress: false
    continue-on-error: false
    needs:
    - release
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.0
      with:
        distribution: corretto
        java-version: '25'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup NodeJs
      uses: actions/setup-node@v7
      with:
        node-version: 24.12.0
        registry-url: https://registry.npmjs.org
    - name: Publish Docs to NPM Registry
      run: sbt docs/publishToNpm
