# The bookstore's settings, unchanged from the PureConfig version except for
# the database password, which now comes from the BOOKSTORE_DB_PASSWORD
# environment variable through an EnvSource layer.
bookstore {
  name = "Scala Bookstore"
  port = 8080
  featured-title = "Zionomicon"
  discount-percent = 10

  db {
    host = "localhost"
    port = 5432
    user = "bookstore"
  }

  tags = ["scala", "functional-programming", "zio"]
}
